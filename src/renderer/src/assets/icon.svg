<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Highlight -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Peacock Lotus Petal Gradients -->
    <linearGradient id="petal-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="petal-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="petal-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Drop Shadow Filter for Petal Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="url(#rim)" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Outer Concentric Symmetry Scale Lines -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.35" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Symmetrical Peacock Lotus Blossom (8 Rotational Petals) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer Layer: 8 Symmetrical Cyan & Teal Petals -->
    <g>
      <!-- Petal 0° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-cyan)" opacity="0.9" />
      <!-- Petal 45° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-teal)" opacity="0.9" transform="rotate(45)" />
      <!-- Petal 90° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-indigo)" opacity="0.9" transform="rotate(90)" />
      <!-- Petal 135° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-cyan)" opacity="0.9" transform="rotate(135)" />
      <!-- Petal 180° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-teal)" opacity="0.9" transform="rotate(180)" />
      <!-- Petal 225° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-indigo)" opacity="0.9" transform="rotate(225)" />
      <!-- Petal 270° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-cyan)" opacity="0.9" transform="rotate(270)" />
      <!-- Petal 315° -->
      <path d="M 0 -48 Q -38 -120 0 -172 Q 38 -120 0 -48 Z" fill="url(#petal-teal)" opacity="0.9" transform="rotate(315)" />
    </g>

    <!-- Inner Layer: 8 Interlocking Peacock Lotus Inner Petal Accents -->
    <g transform="rotate(22.5)">
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" />
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" transform="rotate(45)" />
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" transform="rotate(90)" />
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" transform="rotate(135)" />
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" transform="rotate(180)" />
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" transform="rotate(225)" />
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" transform="rotate(270)" />
      <path d="M 0 -36 Q -26 -92 0 -130 Q 26 -92 0 -36 Z" fill="#ffffff" opacity="0.25" transform="rotate(315)" />
    </g>

    <!-- Center Obsidian Core -->
    <circle cx="0" cy="0" r="54" fill="#070b14" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Centered Rounded Play Mark -->
    <path d="M -13 -20 C -16 -22 -20 -20 -20 -15 L -20 15 C -20 20 -16 22 -13 20 L 21 3 C 24 1 24 -1 21 -3 Z" fill="#ffffff" />
  </g>
</svg>
